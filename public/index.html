<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Deal Room</title>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.34.3/dist/cytoscape.min.js"></script>
<style>
:root {
  --bg:#000; --panel:#0a0a0a; --panel2:#111; --line:#1f1f1f; --line2:#2c2c2c; --text:#f2f2f2; --muted:#8a8a8a; --dim:#5a5a5a;
  --cap:rgba(10,10,10,.92); --card:#0d0d0d; --shadow:rgba(0,0,0,.8); --chart:#050505;
  --red:#ff4d4f; --green:#2fbf71; --amber:#e0a800;
}
:root[data-theme="light"] {
  --bg:#ffffff; --panel:#fafafa; --panel2:#f3f3f3; --line:#e8e8e8; --line2:#d6d6d6; --text:#111111; --muted:#666666; --dim:#9a9a9a;
  --cap:rgba(255,255,255,.95); --card:#ffffff; --shadow:rgba(0,0,0,.14); --chart:#ffffff;
}
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
body { display:grid; grid-template-rows:auto 1fr; }
header { display:flex; align-items:center; gap:16px; padding:12px 18px; border-bottom:1px solid var(--line); }
.brand b { font-size:16px; letter-spacing:.2px; } .brand span { color:var(--muted); font-size:12px; margin-left:10px; }
form { display:flex; align-items:center; gap:8px; margin-left:12px; }
input[type=number] { background:var(--panel2); border:1px solid var(--line2); color:var(--text); border-radius:6px; padding:6px 8px; width:100px; font-size:12.5px; }
button { background:var(--text); color:var(--bg); border:0; border-radius:6px; padding:7px 12px; font-weight:600; cursor:pointer; font-size:12.5px; }
button.ghost { background:transparent; color:var(--text); border:1px solid var(--line2); }
button.on { border-color:var(--text); }
details { position:relative; font-size:12.5px; color:var(--muted); }
details summary { cursor:pointer; list-style:none; padding:6px 8px; border:1px solid var(--line2); border-radius:6px; }
details[open] .menu { position:absolute; top:34px; left:0; z-index:9; background:var(--panel2); border:1px solid var(--line2); border-radius:8px; padding:10px; width:230px; display:grid; gap:8px; }
details label { display:flex; gap:8px; align-items:center; color:var(--text); }
.clock { margin-left:auto; text-align:right; line-height:1.1; }
.clock b { font-size:26px; font-variant-numeric:tabular-nums; font-weight:600; }
.clock div { color:var(--muted); font-size:11px; }
.main { display:grid; grid-template-columns:minmax(0,1fr) 360px; min-height:0; }
@media (max-width: 1000px) { .main { grid-template-columns:1fr; grid-template-rows: 60vh auto; } }
.stage { position:relative; min-height:0; }
#cy { position:absolute; top:42px; bottom:104px; left:0; right:0; }
.steps { position:absolute; left:16px; top:12px; right:200px; display:flex; gap:4px; flex-wrap:wrap; z-index:3; pointer-events:none; }
.step { font-size:10.5px; padding:3px 8px; border-radius:999px; border:1px solid var(--line2); color:var(--dim); background:var(--bg); }
.step.on { color:var(--text); border-color:var(--text); } .step.done { color:var(--muted); border-color:var(--line2); text-decoration:line-through; text-decoration-color:var(--dim); }
.viewbtns { position:absolute; right:14px; top:10px; display:flex; gap:6px; z-index:3; }
.caption { position:absolute; left:16px; right:16px; bottom:14px; z-index:3; display:flex; flex-direction:column; gap:6px; pointer-events:none; }
.cap { background:var(--cap); border:1px solid var(--line2); border-left:3px solid var(--text); border-radius:8px; padding:8px 12px; font-size:13px; max-width:760px; }
.cap .who { color:var(--muted); font-size:11px; margin-bottom:2px; }
.cap.block { border-left-color:var(--red); } .cap.money, .cap.win { border-left-color:var(--green); } .cap.escalate, .cap.flag { border-left-color:var(--amber); }
.side { border-left:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
.tabs { display:flex; border-bottom:1px solid var(--line); }
.tabs button { flex:1; border-radius:0; background:transparent; color:var(--muted); border-bottom:2px solid transparent; padding:10px; font-weight:500; }
.tabs button.active { color:var(--text); border-bottom-color:var(--text); }
.pane { overflow:auto; padding:14px; flex:1; min-height:0; }
.hidden { display:none !important; }
.main.spot { grid-template-columns:minmax(0,1fr) 560px; }
.tr-head { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.tr-head h3 { margin:0; font-size:16px; } .tr-head .sub { color:var(--muted); font-size:12px; }
.call { border:1px solid var(--line2); border-radius:10px; padding:10px 12px; margin-bottom:12px; background:var(--panel2); }
.call.running { border-color:var(--amber); }
.call .meta { display:flex; justify-content:space-between; gap:8px; color:var(--muted); font-size:11px; margin-bottom:6px; flex-wrap:wrap; }
.call .lbl { font-size:10px; letter-spacing:.7px; text-transform:uppercase; color:var(--muted); margin:8px 0 3px; }
.call pre { margin:0; white-space:pre-wrap; word-break:break-word; font:12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color:var(--text); max-height:220px; overflow:auto; }
.call details summary { cursor:pointer; color:var(--muted); font-size:11px; margin-top:8px; }
.check { font-size:12.5px; margin-top:8px; padding:6px 8px; border-radius:6px; border:1px solid var(--line2); }
.check.ok { border-color:var(--green); } .check.bad { border-color:var(--red); color:var(--red); }
.sent { font-size:12.5px; margin-top:6px; }
.pill { position:absolute; left:50%; top:12px; transform:translateX(-50%); z-index:7; font-size:11px; letter-spacing:.8px; text-transform:uppercase; border:1px solid var(--amber); color:var(--amber); background:var(--bg); padding:4px 10px; border-radius:999px; }
#theme { min-width:34px; padding:6px 8px; }
.fhead h3 { margin:0; font-size:15px; } .fhead .sub { color:var(--muted); font-size:12px; margin-top:2px; }
.tag { display:inline-block; font-size:10.5px; padding:2px 7px; border-radius:4px; border:1px solid var(--line2); color:var(--muted); margin:6px 6px 0 0; }
.job { font-size:13px; color:var(--text); margin:10px 0 12px; }
.cbox { border:1px solid var(--line2); border-radius:8px; padding:8px 10px; margin-bottom:8px; }
.cbox h4 { margin:0 0 4px; font-size:10.5px; letter-spacing:.7px; text-transform:uppercase; color:var(--muted); }
.cbox ul { margin:0; padding-left:16px; font-size:12.5px; color:var(--text); }
.st { font-size:10.5px; letter-spacing:.7px; text-transform:uppercase; color:var(--muted); margin:14px 0 6px; }
.item { font-size:12.5px; border-bottom:1px solid var(--line); padding:7px 0; overflow-wrap:anywhere; }
.item .meta { color:var(--dim); font-size:11px; }
.k-block { color:var(--red); } .k-flag, .k-escalate { color:var(--amber); } .k-money, .k-win { color:var(--green); } .k-stage { color:var(--text); font-weight:600; } .k-error { color:var(--red); }
.chart { width:100%; height:140px; border:1px solid var(--line2); border-radius:8px; background:var(--chart); }
.overlay { position:absolute; left:50%; transform:translateX(-50%); z-index:6; }
.closed { top:52px; width:min(620px,92%); background:var(--card); border:1px solid var(--green); border-radius:10px; padding:14px 16px; box-shadow:0 20px 60px var(--shadow); }
.closed b.big { font-size:20px; } .closed a { color:var(--text); font-weight:600; margin-right:14px; }
.invoice { bottom:84px; width:min(480px,92%); background:#fff; color:#111; border:1px solid #d6d6d6; border-radius:10px; padding:16px 18px; box-shadow:0 24px 70px var(--shadow); font-size:13px; }
.invoice .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.invoice .brandmark { font-weight:800; font-size:16px; letter-spacing:-.2px; }
.invoice .pill { font-size:10px; border:1px solid #111; padding:1px 6px; border-radius:4px; font-weight:700; }
.invoice .amt { font-size:26px; font-weight:800; margin:4px 0 8px; }
.invoice .row { display:flex; justify-content:space-between; gap:10px; padding:4px 0; border-bottom:1px solid #eee; }
.invoice .stamp { position:absolute; right:20px; top:48px; border:3px solid #1a8f4e; color:#1a8f4e; font-weight:900; font-size:26px; padding:1px 10px; border-radius:6px; transform:rotate(-10deg); opacity:0; transition:opacity .35s; }
.invoice.paid .stamp { opacity:1; }
.invoice a { color:#111; font-weight:700; }
</style>
</head>
<body>
<header>
  <div class="brand"><b>Deal Room</b><span>company agents close B2B deals end to end</span></div>
  <form id="start">
    <input id="budget" type="number" value="120000" step="1000" min="110000" title="Acme's private annual budget" />
    <details><summary>Options</summary><div class="menu">
      <label><input id="aggr" type="checkbox" /> Aggressive buyer</label>
      <label><input id="allbb" type="checkbox" /> All agents on Brainbase</label>
      <a href="/scale.html" style="color:var(--text)">Scale view (simulation) →</a>
    </div></details>
    <button type="submit">Start deal</button>
  </form>
  <button class="ghost" id="theme" type="button" title="Toggle light / dark">◐</button>
  <div class="clock"><b id="clock">0:00</b><div>vs. 134-day median sales cycle</div></div>
</header>
<div class="main" id="main">
  <div class="stage">
    <div id="cy"></div>
    <div class="steps" id="steps"></div>
    <div class="viewbtns"><button class="ghost" id="tourBtn">▶ Demo tour</button><button class="ghost" id="follow">Follow</button><button class="ghost" id="fit">Big picture</button></div>
    <div class="pill hidden" id="tourPill"></div>
    <div class="caption" id="caption"></div>
    <div class="overlay closed hidden" id="closed"></div>
    <div class="overlay invoice hidden" id="invoice"></div>
  </div>
  <aside class="side">
    <div class="tabs"><button id="tFocus" class="active">Agent</button><button id="tLog">Deal log</button></div>
    <div class="pane" id="focus"><div style="color:var(--muted);font-size:13px">Select an agent to see its charter, what it received and what it sent.</div></div>
    <div class="pane hidden" id="log"></div>
    <div class="pane hidden" id="transcript"></div>
  </aside>
</div>

<script type="module">
import { buildStyle, ART, RED, buildElements, setPose, sendPacket, applyTheme, getTheme, theme } from "/graph.js";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const fmt = (n) => Math.round(n).toLocaleString("en-US");

applyTheme(getTheme());
const cy = cytoscape({ container: $("#cy"), style: buildStyle(), elements: [], wheelSensitivity: 0.25, minZoom: 0.05, maxZoom: 3 });
$("#theme").onclick = () => { applyTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light"); cy.style(buildStyle()); applyPoses(); renderFocus(); };
window.cy = cy;
cy.autounselectify(true);
function markFocus(id) { cy.nodes(".agent").removeClass("focused"); if (id) cy.getElementById(id).addClass("focused"); }

let dealId = new URLSearchParams(location.search).get("deal"), state = null, seen = 0, focusId = null, timer = null, builtFor = null;
let follow = false, lastFollow = 0, frame = 0;
const blockedUntil = {};

// companies from live state; chain of command comes from each agent's reportsTo
function companiesFrom(s) {
  const map = new Map();
  const add = (company, m) => { if (!map.has(company)) map.set(company, { name: company, buyer: company === s.buyer, members: [] }); map.get(company).members.push(m); };
  for (const [id, a] of Object.entries(s.agents)) add(a.company, { id, reportsTo: a.reportsTo, role: a.role, model: a.label, frontier: a.platform === "Brainbase" });
  return [...map.values()];
}
function build(s) {
  cy.elements().remove();
  cy.add(buildElements(companiesFrom(s), (m) => `${m.role}\n${m.model}`).els);
  cy.fit(cy.elements(), 50);
  builtFor = s.id;
}
function targetOf(e) {
  if (!e.to || e.to === e.agent) return null;
  if (cy.getElementById(e.to).nonempty()) return e.to;
  if (e.to === "stripe" && state.winner) return Object.keys(state.agents).find((id) => id.startsWith(state.winner.key) && id.endsWith(".desk")) || null;
  return null;
}
function animateEvent(e) {
  if (e.art === "channel" && e.pairs) for (const [x, y] of e.pairs) { const id = `c:${x}>${y}`; if (cy.getElementById(id).empty() && cy.getElementById(x).nonempty() && cy.getElementById(y).nonempty()) cy.add({ group: "edges", data: { id, source: x, target: y }, classes: "chan" }); }
  const bad = e.kind === "block" || e.art === "fraud" || e.art === "eliminate";
  const cls = bad ? "bad" : e.kind === "money" ? "money" : "";
  if (e.kind === "block" && e.agent) blockedUntil[e.agent] = Date.now() + 1800;
  if (e.art === "fraud") { blockedUntil[e.to] = Date.now() + 1800; return; }
  const to = targetOf(e);
  if (e.agent && to) sendPacket(cy, e.agent, to, { label: ART[e.art] || "•", cls });
}
function applyPoses() {
  if (!state) return;
  frame++;
  cy.nodes(".agent").forEach((n) => {
    const id = n.id(), a = state.agents[id];
    let pose = "idle";
    if (blockedUntil[id] > Date.now()) pose = "block";
    else if (a?.status === "working") pose = "work";
    else if (state.done && state.winner && (id.startsWith(state.winner.key) || id.startsWith("acme"))) pose = "done";
    setPose(n, pose, frame);
  });
}
setInterval(applyPoses, 380);

// camera
$("#fit").onclick = () => { follow = false; $("#follow").classList.remove("on"); cy.animate({ fit:{ eles: cy.elements(), padding:50 } }, { duration:600 }); };
$("#follow").onclick = () => { follow = !follow; $("#follow").classList.toggle("on", follow); if (!follow) $("#fit").onclick(); };
function zoomTo(id) { const n = cy.getElementById(id); if (n.nonempty()) cy.animate({ center:{ eles:n }, zoom: 1.4 }, { duration:600 }); }
cy.on("tap", "node.agent", (evt) => { focusId = evt.target.id(); markFocus(focusId); if (spotId) spotlight(focusId); else { showTab("focus"); zoomTo(focusId); renderFocus(); } });
cy.on("dbltap", "node.agent", (evt) => spotlight(evt.target.id()));

// ---------- Spotlight: one agent's real model calls, everything else dimmed ----------
let spotId = null, calls = [], callsTimer = null;
const typed = new Set();
function partnersOf(id) {
  const ids = new Set([id]);
  const a = state?.agents[id]; if (a?.reportsTo) ids.add(a.reportsTo);
  for (const [k, v] of Object.entries(state?.agents || {})) if (v.reportsTo === id) ids.add(k);
  for (const e of state?.events || []) { if (e.agent === id && state.agents[e.to]) ids.add(e.to); if (e.to === id && state.agents[e.agent]) ids.add(e.agent); }
  return ids;
}
function applyDim() {
  if (!spotId) { cy.elements().removeClass("dim spot"); return; }
  const keep = partnersOf(spotId);
  cy.batch(() => {
    cy.elements().removeClass("spot");
    cy.nodes(".agent").forEach((n) => n.toggleClass("dim", !keep.has(n.id())));
    cy.nodes(".company").forEach((c) => c.toggleClass("dim", !c.children().some((n) => keep.has(n.id()))));
    cy.edges().forEach((e) => e.toggleClass("dim", !(e.source().id() === spotId || e.target().id() === spotId)));
    cy.getElementById(spotId).addClass("spot");
  });
}
function spotlight(id) {
  spotId = id; focusId = id;
  $("#main").classList.add("spot"); cy.resize();
  showTab("transcript"); applyDim();
  const keep = partnersOf(id);
  cy.animate({ fit: { eles: cy.nodes(".agent").filter((n) => keep.has(n.id())), padding: 90 } }, { duration: 700 });
  loadCalls(); clearInterval(callsTimer); callsTimer = setInterval(loadCalls, 1500);
}
function exitSpotlight() {
  spotId = null; clearInterval(callsTimer);
  $("#main").classList.remove("spot"); cy.resize(); applyDim(); showTab("focus"); renderFocus();
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && spotId) exitSpotlight(); });
async function loadCalls() {
  if (!dealId || !spotId) return;
  calls = await fetch(`/api/deals/${dealId}/calls`).then((r) => r.json()).catch(() => calls) || [];
  renderTranscript();
}
function renderTranscript() {
  if (!spotId || !state) return;
  const a = state.agents[spotId]; if (!a) return;
  const mine = calls.filter((c) => c.agent === spotId).sort((x, y) => x.n - y.n);
  const secs = (c) => c.t1 ? ((c.t1 - c.t0) / 1000).toFixed(1) + "s" : Math.round((Date.now() - c.t0) / 1000) + "s…";
  const box = $("#transcript");
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  box.innerHTML = `
    <div class="tr-head"><div><h3>${esc(a.role)}</h3><div class="sub">${esc(a.company)} · ${esc(a.platform === "Brainbase" ? "frontier · " + a.label : "open-weight · " + a.label)} · reports to ${esc(a.reportsTo ? nameOf(a.reportsTo) : "no one (top of the chain)")}</div></div>
      <button class="ghost" id="exitSpot" style="margin-left:auto">Exit spotlight</button></div>
    <div class="st">Real model calls · ${mine.length}</div>
    ${mine.map((c, i) => `
      <div class="call ${c.status}" data-n="${c.n}">
        <div class="meta"><span>Call ${i + 1} · ${new Date(c.t0).toLocaleTimeString()} · ${esc(c.model)} · ${secs(c)}</span>
          <span>${c.threadId ? "Brainbase thread " + esc(c.threadId.slice(0, 8)) + "…" : c.platform === "Workers AI" ? "Cloudflare Workers AI" : ""}${c.via === "fallback" ? " · fallback model" : ""}</span></div>
        <div class="lbl">Received</div><pre>${esc(c.input)}</pre>
        <details><summary>Instructions and charter given to the model</summary><pre>${esc(c.system)}</pre></details>
        <div class="lbl">Model output</div><pre class="out" data-full="${esc(c.output || "")}">${c.status === "running" ? "working…" : typed.has(c.n) ? esc(c.output || "") : ""}</pre>
        ${c.check ? `<div class="check ${c.check.ok ? "ok" : "bad"}">${c.check.ok ? "✓ Charter check passed" : "⛔ Charter check"}: ${c.check.notes.map(esc).join(" · ")}</div>` : ""}
        ${c.sentTo ? `<div class="sent">${ART[c.art] || "→"} Sent to <b>${esc(nameOf(c.sentTo))}</b></div>` : ""}
      </div>`).join("") || `<div style="color:var(--dim);font-size:12.5px">No model calls yet. This agent is waiting for its turn in the deal.</div>`}`;
  $("#exitSpot").onclick = exitSpotlight;
  // type out outputs we have not shown yet
  box.querySelectorAll("pre.out").forEach((pre) => {
    const n = Number(pre.closest(".call").dataset.n), full = pre.dataset.full;
    if (!full || typed.has(n)) return;
    typed.add(n);
    let i = 0; const step = Math.max(3, Math.ceil(full.length / 90));
    const t = setInterval(() => { i += step; pre.textContent = full.slice(0, i); if (i >= full.length) clearInterval(t); }, 18);
  });
  if (atBottom) box.scrollTop = box.scrollHeight;
}

// panels
function nameOf(id) { return state.agents[id] ? `${state.agents[id].company} · ${state.agents[id].role}` : id; }
function renderFocus() {
  if (!state || !focusId) return;
  const id = focusId, a = state.agents[id], prof = state.profiles?.[id] || { job:"", can:[], ask:[], prove:[] };
  if (!a) return;
  const mine = state.events.filter((e) => e.agent === id || e.to === id).slice().reverse();
  const track = a && id.endsWith(".desk") && Object.values(state.tracks).find((t) => id.startsWith(t.key));
  const boss = a.reportsTo ? nameOf(a.reportsTo) : "top of the chain of command";
  const list = (xs) => xs.length ? `<ul>${xs.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : `<div style="color:var(--dim);font-size:12px">—</div>`;
  $("#focus").innerHTML = `
    <div class="fhead"><h3>${esc(a.role)}</h3><div class="sub">${esc(a.company)} · reports to: ${esc(boss)}</div>
      <span class="tag">${esc(a.platform === "Brainbase" ? "frontier · " + a.label : "open-weight · " + a.label)}</span><span class="tag">${a.calls} calls · ${esc(a.status)}</span></div>
    <button id="spotBtn" style="margin:10px 0 2px">Spotlight this agent's real work</button>
    <div class="job">${esc(prof.job)}</div>
    <div class="cbox"><h4>Can do alone</h4>${list(prof.can)}</div>
    <div class="cbox"><h4>Must ask</h4>${list(prof.ask)}</div>
    <div class="cbox"><h4>Must prove</h4>${list(prof.prove)}</div>
    ${track || id === "acme.procurement" ? `<div class="st">Price per year, round by round</div>${chart(track ? [track] : Object.values(state.tracks))}` : ""}
    ${a.last ? `<div class="st">Latest output</div><div class="item">${esc(a.last)}</div>` : ""}
    <div class="st">Inbox / outbox · ${mine.length}</div>
    ${mine.map((e) => `<div class="item"><div class="meta">${new Date(e.t).toLocaleTimeString()} · ${e.agent === id ? "sent → " + esc(nameOf(e.to || "")) : "from " + esc(nameOf(e.agent))} ${ART[e.art] || ""}</div><div class="k-${e.kind}">${esc(e.text)}</div></div>`).join("") || `<div style="color:var(--dim);font-size:12px">Nothing yet.</div>`}`;
}
document.addEventListener("click", (e) => { if (e.target && e.target.id === "spotBtn" && focusId) spotlight(focusId); });
function chart(tracks) {
  const pts = tracks.flatMap((t) => t.history || []); if (!pts.length) return `<div style="color:var(--dim);font-size:12px">No offers yet.</div>`;
  const W = 330, H = 140, P = 24, vals = pts.flatMap((p) => [p.price, p.asked || p.price]).concat([state.limits.budget]);
  const lo = Math.min(...vals) * 0.95, hi = Math.max(...vals) * 1.03, Y = (v) => H - P + 4 - ((v - lo) / (hi - lo)) * (H - P * 1.4);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}"><line x1="${P}" x2="${W - 6}" y1="${Y(state.limits.budget)}" y2="${Y(state.limits.budget)}" stroke="#555" stroke-dasharray="3 3"/><text x="${W - 8}" y="${Y(state.limits.budget) - 4}" fill="#777" font-size="9" text-anchor="end">buyer budget (private)</text>`;
  tracks.forEach((t, ti) => {
    const hs = (t.history || []).map((h, i) => ({ ...h, i })), n = Math.max(2, hs.length), X = (i) => P + (i * (W - P * 1.6)) / (n - 1);
    const v = hs.filter((h) => h.by === "vendor"), b = hs.filter((h) => h.by === "buyer"), col = ti ? theme().open : theme().strong;
    if (v.length > 1) s += `<polyline fill="none" stroke="${col}" stroke-width="2" points="${v.map((h) => `${X(h.i)},${Y(h.price)}`).join(" ")}"/>`;
    if (b.length > 1) s += `<polyline fill="none" stroke="#666" stroke-dasharray="3 3" points="${b.map((h) => `${X(h.i)},${Y(h.price)}`).join(" ")}"/>`;
    v.forEach((h) => { s += `<circle cx="${X(h.i)}" cy="${Y(h.price)}" r="3.5" fill="${col}"/>`; if (h.blocked && h.asked && h.asked !== h.price) s += `<text x="${X(h.i)}" y="${Y(h.asked)}" fill="${RED}" font-size="12" text-anchor="middle" dominant-baseline="central">✕</text>`; });
    b.forEach((h) => { s += `<rect x="${X(h.i) - 3}" y="${Y(h.price) - 3}" width="6" height="6" fill="#666"/>`; });
    const last = v.at(-1); if (last) s += `<text x="${Math.min(W - 44, X(last.i) + 6)}" y="${Y(last.price) - 6}" fill="${col}" font-size="10" font-weight="700">${esc(t.name.split(" ")[0])} $${fmt(last.price / 1000)}K</text>`;
  });
  return s + `</svg><div style="color:var(--dim);font-size:11px;margin-top:4px">● vendor · ■ buyer · <span style="color:${RED}">✕</span> blocked by the vendor's own charter</div>`;
}
function renderLog() {
  $("#log").innerHTML = state.events.slice().reverse().map((e) => `<div class="item"><div class="meta">${new Date(e.t).toLocaleTimeString()} · ${esc(e.company)}${state.agents[e.agent] ? " · " + esc(state.agents[e.agent].role) : ""} ${ART[e.art] || ""}</div><div class="k-${e.kind}">${esc(e.text)}</div></div>`).join("");
}
function renderSteps() { $("#steps").innerHTML = state.stages.map((s, i) => `<span class="step ${state.done || i < state.stage ? "done" : i === state.stage ? "on" : ""}">${esc(s)}</span>`).join(""); }
function renderCaption() {
  const evs = state.events.filter((e) => e.kind !== "stage").slice(-2);
  $("#caption").innerHTML = evs.map((e) => `<div class="cap ${e.kind}"><div class="who">${esc(state.agents[e.agent] ? nameOf(e.agent) : e.company)} ${ART[e.art] || ""}</div>${esc(e.text.length > 220 ? e.text.slice(0, 220) + "…" : e.text)}</div>`).join("");
}
function renderOverlays() {
  const inv = state.invoice, box = $("#invoice"), show = inv && inv.sentAt && (!inv.paidAt || Date.now() - inv.paidAt < 12000);
  box.classList.toggle("hidden", !show);
  if (show) {
    box.classList.toggle("paid", !!inv.paidAt);
    box.innerHTML = `<div class="top"><span class="brandmark">Invoice ${esc(inv.number || "")}</span><span class="pill">${inv.simulated ? "SIMULATED" : inv.live ? "LIVE" : "STRIPE SANDBOX"}</span></div>
      <div style="color:#666">${esc(inv.vendor)} → ${esc(state.buyer)}</div><div class="amt">$${fmt(inv.amount)}</div>
      <div class="row"><span>Purchase order</span><b>${esc(state.po)}</b></div><div class="row"><span>Terms</span><b>net ${inv.dueDays} · 2% early-pay discount</b></div>
      <div class="row"><span>Status</span><b>${inv.paidAt ? "Paid by Acme's finance agent" : "Sent · awaiting payment"}</b></div>
      ${inv.url ? `<div style="margin-top:8px"><a href="${esc(inv.url)}" target="_blank">Open in Stripe →</a></div>` : ""}<div class="stamp">PAID</div>`;
  }
  const c = $("#closed");
  c.classList.toggle("hidden", !state.done);
  if (state.done) {
    const secs = Math.round(((state.finishedAt || Date.now()) - state.startedAt) / 1000);
    c.innerHTML = state.winner
      ? `<b class="big">Closed in ${Math.floor(secs / 60)}m ${secs % 60}s</b> <span style="color:var(--muted)">· median is 134 days</span>
         <div style="margin:6px 0 8px;color:var(--muted)">${esc(state.winner.name)} · $${fmt(state.winner.offer.price)}/yr · ${state.winner.offer.termMonths} mo · total $${fmt(state.winner.tcv)} · ${esc(state.po)}</div>
         ${state.tenant ? `<a href="${esc(state.tenant.path)}" target="_blank">Open provisioned workspace →</a>` : ""}${inv?.url ? `<a href="${esc(inv.url)}" target="_blank">Stripe invoice →</a>` : ""}`
      : `<b class="big" style="color:var(--amber)">No deal</b><div style="margin-top:6px;color:var(--muted)">No vendor fit inside the buyer's charter, so the agents walked away.</div>`;
  }
}
function showTab(t) { $("#tFocus").classList.toggle("active", t === "focus" || t === "transcript"); $("#tLog").classList.toggle("active", t === "log"); $("#focus").classList.toggle("hidden", t !== "focus"); $("#log").classList.toggle("hidden", t !== "log"); $("#transcript").classList.toggle("hidden", t !== "transcript"); }
$("#tFocus").onclick = () => showTab(spotId ? "transcript" : "focus"); $("#tLog").onclick = () => showTab("log");
setInterval(() => { if (!state) return; const s = Math.max(0, Math.round(((state.finishedAt || Date.now()) - state.startedAt) / 1000)); $("#clock").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }, 250);

// ---------- Demo tour: spotlights the key agents at the right moments, then zooms out to the scale view ----------
let tour = null;
function tourPick(stage) {
  const blockedDesk = ["beacon.desk", "quickdash.desk"].find((id) => state.events.some((e) => e.agent === id && e.kind === "block" && Date.now() - e.t < 20000));
  return {
    "Proposals": "beacon.orchestrator", "Security review": "acme.security", "Negotiation": blockedDesk || "beacon.desk",
    "Legal review": "acme.legal", "Award": "acme.orchestrator", "Approvals": "acme.orchestrator",
    "Onboarding & PO": "acme.finance", "Invoice & payment": "acme.finance",
  }[stage] || null;
}
function tourTick() {
  if (!tour || !state) return;
  const stage = state.stages[state.stage];
  $("#tourPill").textContent = `Demo tour · ${state.done ? "deal closed" : stage}`;
  if (state.done) {
    if (!tour.ending) { tour.ending = true; if (spotId) exitSpotlight(); setTimeout(() => $("#fit").onclick(), 300); setTimeout(() => { location.href = "/scale.html?tour=1"; }, 9000); }
    return;
  }
  const want = tourPick(stage);
  if (want && want !== spotId && Date.now() - (tour.lastSwitch || 0) > 5000 && state.agents[want]) { tour.lastSwitch = Date.now(); spotlight(want); }
  if (!want && spotId) exitSpotlight();
}
$("#tourBtn").onclick = async () => {
  tour = { lastSwitch: 0 };
  $("#tourPill").classList.remove("hidden");
  await startDeal();
};

async function load() {
  const s = await fetch(`/api/deals/${dealId}`).then((r) => r.json()).catch(() => null); if (!s) return;
  state = s;
  if (builtFor !== s.id) { build(s); seen = 0; }
  const fresh = s.events.slice(seen); seen = s.events.length;
  fresh.forEach((e, i) => setTimeout(() => animateEvent(e), i * 220));
  if (follow && fresh.length && Date.now() - lastFollow > 2500) { const e = [...fresh].reverse().find((x) => cy.getElementById(x.agent).nonempty()); if (e) { lastFollow = Date.now(); focusId = e.agent; zoomTo(e.agent); } }
  renderSteps(); renderCaption(); if (!spotId) renderFocus(); renderLog(); renderOverlays();
  if (spotId) applyDim();
  tourTick();
  if (s.done) { clearInterval(timer); setTimeout(() => $("#fit").onclick(), 1500); }
}
function poll() { clearInterval(timer); load(); timer = setInterval(load, 1000); }
function demoKey() { try { const u = new URL(location.href); const k = u.searchParams.get("key"); if (k) { localStorage.setItem("dealroom-key", k); } return k || localStorage.getItem("dealroom-key") || ""; } catch { return ""; } }
async function startDeal() {
  if (spotId) exitSpotlight();
  let key = demoKey();
  const post = () => fetch("/api/deals", { method:"POST", headers:{ "content-type":"application/json", "x-demo-key": key }, body: JSON.stringify({ budget:Number($("#budget").value), aggressive:$("#aggr").checked, allBrainbase:$("#allbb").checked }) });
  let r = await post();
  if (r.status === 401) { key = prompt("Demo passcode") || ""; try { localStorage.setItem("dealroom-key", key); } catch {} r = await post(); if (r.status === 401) return; }
  dealId = (await r.json()).id; history.replaceState(null, "", "?deal=" + dealId);
  focusId = null; builtFor = null; calls = []; typed.clear(); $("#focus").innerHTML = `<div style="color:var(--muted);font-size:13px">Select an agent to see its charter, what it received and what it sent. Double-click an agent to spotlight its real work.</div>`;
  poll();
}
$("#start").addEventListener("submit", (e) => { e.preventDefault(); tour = null; $("#tourPill").classList.add("hidden"); startDeal(); });
window.addEventListener("resize", () => cy.resize());
if (dealId) poll();
</script>
