<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Deal Room · Scale</title>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.34.3/dist/cytoscape.min.js"></script>
<style>
:root { --bg:#000; --line:#1f1f1f; --line2:#2c2c2c; --text:#f2f2f2; --muted:#8a8a8a; --note:rgba(0,0,0,.8); }
:root[data-theme="light"] { --bg:#fff; --line:#e8e8e8; --line2:#d6d6d6; --text:#111; --muted:#666; --note:rgba(255,255,255,.92); }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
body { display:grid; grid-template-rows:auto 1fr; }
header { display:flex; align-items:center; gap:14px; padding:12px 18px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
header b { font-size:16px; } .sim { font-size:10.5px; letter-spacing:.8px; border:1px solid #f5b700; color:#f5b700; padding:3px 8px; border-radius:4px; }
button { background:var(--text); color:var(--bg); border:0; border-radius:6px; padding:7px 12px; font-weight:600; cursor:pointer; font-size:12.5px; }
button.ghost { background:transparent; color:var(--text); border:1px solid var(--line2); }
a { color:var(--text); font-size:12.5px; }
.stats { margin-left:auto; display:flex; gap:18px; font-variant-numeric:tabular-nums; }
.stats div { text-align:right; } .stats b { font-size:20px; display:block; } .stats span { color:var(--muted); font-size:11px; }
.stage { position:relative; } #cy { position:absolute; inset:0; }
.note { position:absolute; left:16px; bottom:14px; color:var(--muted); font-size:12px; max-width:640px; background:var(--note); padding:8px 10px; border:1px solid var(--line2); border-radius:8px; }
</style>
</head>
<body>
<header>
  <b>Deal Room · scale view</b><span class="sim">SIMULATION</span>
  <button id="grow">Grow one level</button>
  <button class="ghost" id="shrink">Back one level</button>
  <button class="ghost" id="vendors">+ vendor</button>
  <button class="ghost" id="pause">Pause traffic</button>
  <button class="ghost" id="theme" type="button" title="Toggle light / dark">◐</button>
  <a href="/">← live deal</a>
  <div class="stats">
    <div><b id="nAgents">0</b><span>agents</span></div>
    <div><b id="nCompanies">0</b><span>companies</span></div>
    <div><b id="nMsgs">0</b><span>messages</span></div>
    <div><b id="depth">L1</b><span>chain of command</span></div>
  </div>
</header>
<div class="stage">
  <div id="cy"></div>
  <div class="note">Synthetic agents showing how the same chain of command scales: orchestrator → departments → teams → specialists. The live deal runs 11 real agents; this view shows the architecture at thousands.</div>
</div>
<script type="module">
import { buildStyle, buildElements, setPose, sendPacket, coneLayout, applyTheme, getTheme, theme } from "/graph.js";
const $ = (s) => document.querySelector(s);

applyTheme(getTheme());
const extraStyle = () => [
  { selector: "node.agent.mini", style: { "width":12, "height":18, "font-size":8, "text-margin-y":3, "min-zoomed-font-size":10 } },
  { selector: "node.agent.micro", style: { "width":7, "height":10, "label":"", "min-zoomed-font-size":99 } },
  { selector: "edge.reports", style: { "curve-style":"haystack", "haystack-radius":0, "width":0.8, "line-color":theme().reports } },
  { selector: "node.coname", style: { "background-opacity":0, "border-width":0, "width":1, "height":1, "label":"data(label)", "color":theme().strong, "font-size":22, "font-weight":700, "text-valign":"center", "events":"no" } },
];
const cy = cytoscape({ container: $("#cy"), wheelSensitivity: 0.25, minZoom: 0.02, maxZoom: 3, style: buildStyle(extraStyle()) });
$("#theme").onclick = () => { applyTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light"); cy.style(buildStyle(extraStyle())); };
window.cy = cy;

// Department and team names so the tree reads like a real enterprise
const BUYER_DEPTS = {
  "Procurement": ["Sourcing", "Negotiation", "Supplier onboarding", "Spend analytics"],
  "Security": ["Vendor risk", "AppSec review", "Pen-test review", "Compliance evidence"],
  "Legal": ["MSA review", "DPA & privacy", "IP & indemnity", "Litigation risk"],
  "Finance & AP": ["FP&A budget", "Accounts payable", "Treasury", "Tax"],
  "IT": ["Architecture", "SSO & SCIM", "Data residency", "Integration"],
  "Privacy": ["GDPR", "CCPA", "Subprocessors", "AI use"],
};
const VENDOR_DEPTS = {
  "Deal desk": ["Pricing", "Discount approvals", "Quote builder", "Revenue recognition"],
  "Trust & security": ["Questionnaires", "SOC 2 evidence", "Pen-test reports", "Subprocessors"],
  "Legal": ["Redlines", "DPA", "Order forms", "Signatures"],
  "Billing": ["Invoicing", "Collections", "Tax", "Cash application"],
  "Onboarding": ["Provisioning", "SSO setup", "Data migration", "Training"],
};
const SPECIALISTS = ["Question", "Clause", "Line item", "Control", "Check", "Case"];
const VENDOR_NAMES = ["Beacon Analytics", "Quickdash", "Northstar Data", "Lumen BI", "Vector Metrics", "Keel Analytics"];

let depth = 1, vendorCount = 2, msgs = 0, paused = false, frame = 0;

function company(name, buyer, maxDepth) {
  const depts = buyer ? BUYER_DEPTS : VENDOR_DEPTS;
  const key = name.toLowerCase().replace(/[^a-z]/g, "");
  const members = [{ id: `${key}.orch`, role: "Orchestrator", model: "frontier", frontier: true }];
  Object.entries(depts).forEach(([dept, teams], di) => {
    const d = `${key}.d${di}`;
    if (maxDepth >= 1) members.push({ id: d, reportsTo: `${key}.orch`, role: dept, model: "open-weight" });
    if (maxDepth >= 2) teams.forEach((team, ti) => {
      const t = `${d}.t${ti}`;
      members.push({ id: t, reportsTo: d, role: team, model: "open-weight", cls: "mini" });
      if (maxDepth >= 3) for (let k = 0; k < 6; k++) {
        const sp = `${t}.s${k}`;
        members.push({ id: sp, reportsTo: t, role: `${SPECIALISTS[k % SPECIALISTS.length]} ${ti * 6 + k + 1}`, model: "open-weight", cls: "micro" });
        if (maxDepth >= 4) for (let j = 0; j < 4; j++) members.push({ id: `${sp}.x${j}`, reportsTo: sp, role: "sub-specialist", model: "open-weight", cls: "micro" });
      }
    });
  });
  return { name, buyer, members };
}
function world() {
  return [company("Acme Corp", true, depth), ...VENDOR_NAMES.slice(0, vendorCount).map((n) => company(n, false, depth))];
}

function render(animate) {
  const companies = world();
  const opts = { levelGap: depth >= 4 ? 300 : depth >= 3 ? 280 : 240, center: depth >= 3 ? 360 : 280 };
  const els = buildElementsWith(companies, opts);
  const old = new Map(cy.nodes(".agent").map((n) => [n.id(), n.position()]));
  cy.batch(() => {
    cy.elements().remove();
    cy.add(els);
    // new nodes start at their manager's old position, then everything glides to the new layout
    if (animate) cy.nodes(".agent").forEach((n) => {
      const target = { ...n.position() };
      const from = old.get(n.id()) || old.get(n.data("boss")) || target;
      n.position({ ...from });
      n.data("goal", target);
    });
  });
  if (animate) cy.nodes(".agent").forEach((n) => n.animate({ position: n.data("goal") }, { duration: 900, easing: "ease-in-out-cubic" }));
  setTimeout(() => cy.animate({ fit: { eles: cy.elements(), padding: 40 } }, { duration: 700 }), animate ? 950 : 0);
  $("#nAgents").textContent = cy.nodes(".agent").length.toLocaleString();
  $("#nCompanies").textContent = companies.length;
  $("#depth").textContent = ["L1 departments", "L1 departments", "L2 teams", "L3 specialists", "L4 sub-specialists"][depth];
}
function buildElementsWith(companies, opts) {
  const built = buildElements(companies, (m) => m.role, coneLayout, opts);
  const anchors = built.anchors;
  // no company boxes in the scale view: cones point in different directions
  const els = built.els.filter((e) => !(e.group === "nodes" && e.classes === "company"));
  for (const e of els) if (e.group === "nodes") delete e.data.parent;
  for (const c of companies) {
    const a = anchors[c.name];
    els.push({ group: "nodes", data: { id: "name:" + c.name, label: c.name + (c.buyer ? " · buyer" : "") }, position: { x: a.x - Math.cos(a.axis) * 150, y: a.y - Math.sin(a.axis) * 150 - 30 }, classes: "coname" });
  }
  return els;
}

// Simulated traffic: tasks flow down the chain of command, results flow back up, orchestrators and counterpart departments talk across companies.
function tick() {
  if (paused) return;
  frame++;
  const agents = cy.nodes(".agent");
  const withBoss = agents.filter((n) => n.data("boss"));
  const n = Math.min(14, 2 + Math.floor(withBoss.length / 120));
  for (let i = 0; i < n; i++) {
    const node = withBoss[Math.floor(Math.random() * withBoss.length)]; if (!node) break;
    const down = Math.random() < 0.5;
    const [a, b] = down ? [node.data("boss"), node.id()] : [node.id(), node.data("boss")];
    sendPacket(cy, a, b, { dot: true, noEdge: true, duration: 700 + Math.random() * 500, cls: Math.random() < 0.03 ? "bad" : "" });
    working.set(b, Date.now() + 1200);
    msgs++;
  }
  const orchs = agents.filter((x) => x.id().endsWith(".orch"));
  const buyer = orchs.filter((x) => x.id().startsWith("acmecorp"))[0];
  if (buyer && frame % 6 === 0) {
    const v = orchs.filter((x) => x !== buyer)[Math.floor(Math.random() * (orchs.length - 1))];
    if (v) { const [a, b] = Math.random() < 0.5 ? [buyer.id(), v.id()] : [v.id(), buyer.id()]; sendPacket(cy, a, b, { label: "💬", duration: 1100 }); msgs++; working.set(b, Date.now() + 1500); }
  }
  $("#nMsgs").textContent = msgs.toLocaleString();
}
const working = new Map();
setInterval(tick, 160);
setInterval(() => {
  const now = Date.now(), f = ++frame;
  cy.nodes(".agent").forEach((nd) => {
    if (nd.hasClass("micro")) return;
    setPose(nd, (working.get(nd.id()) || 0) > now ? "work" : "idle", f);
  });
}, 400);

$("#grow").onclick = () => { if (depth < 4) { depth++; render(true); } };
$("#shrink").onclick = () => { if (depth > 1) { depth--; render(true); } };
$("#vendors").onclick = () => { if (vendorCount < VENDOR_NAMES.length) { vendorCount++; render(true); } };
$("#pause").onclick = () => { paused = !paused; $("#pause").textContent = paused ? "Resume traffic" : "Pause traffic"; };
window.addEventListener("resize", () => cy.resize());
render(false);
if (new URLSearchParams(location.search).get("tour")) {
  const pill = document.createElement("div");
  pill.textContent = "Demo tour · scale simulation";
  pill.style.cssText = "position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:7;font-size:11px;letter-spacing:.8px;text-transform:uppercase;border:1px solid #e0a800;color:#e0a800;background:var(--bg);padding:4px 10px;border-radius:999px";
  document.querySelector(".stage").appendChild(pill);
  const steps = [() => $("#grow").click(), () => $("#grow").click(), () => $("#vendors").click(), () => $("#vendors").click()];
  steps.forEach((fn, i) => setTimeout(fn, 2500 + i * 4500));
}
</script>
</body>
</html>
